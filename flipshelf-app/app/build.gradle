plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.fleetmc.flipshelf"
    compileSdk 35

    defaultConfig {
        applicationId "com.fleetmc.flipshelf"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
    def ksPath = ksProps.getProperty("storeFile") ?: System.getenv("FLIPSHELF_KEYSTORE")

    signingConfigs {
        debug {
            storeFile rootProject.file("signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksProps.getProperty("storePassword") ?: System.getenv("FLIPSHELF_KEYSTORE_PASSWORD")
                keyAlias ksProps.getProperty("keyAlias") ?: System.getenv("FLIPSHELF_KEY_ALIAS")
                keyPassword ksProps.getProperty("keyPassword") ?: System.getenv("FLIPSHELF_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "io.legere:pdfiumandroid:1.0.35"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mlkit:language-id:17.0.6"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
}
