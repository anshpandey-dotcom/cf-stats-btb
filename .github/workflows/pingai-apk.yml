name: Build PING AI APK

on:
  push:
    paths:
      - "PingAI/**"
      - ".github/workflows/pingai-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PingAI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Verify signature and rename
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk PING-AI-V1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PING-AI-V1
          path: PingAI/PING-AI-V1.apk
