name: Build Clapping Cat APK

on:
  push:
    paths:
      - 'ClappingCat/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClappingCat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ClappingCat.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClappingCat-apk
          path: ClappingCat/ClappingCat.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clapping-cat-latest --yes --cleanup-tag || true
          gh release create clapping-cat-latest ClappingCat.apk \
            --title "Clapping Cat APK (latest build)" \
            --notes "Install ClappingCat.apk on an ARCore supported Android phone." \
            --target "${{ github.sha }}"
