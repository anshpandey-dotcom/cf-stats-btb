name: Attack Mode APK

on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths:
      - "attack-mode/**"
      - ".github/workflows/attack-mode-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: attack-mode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('attack-mode/android/**/*.gradle', 'attack-mode/android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: bun install --frozen-lockfile

      - run: bun run build:web

      - run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk attack-mode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: attack-mode-apk
          path: attack-mode/attack-mode.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: attack-mode-latest
          name: Attack Mode (latest APK)
          make_latest: true
          files: attack-mode/attack-mode.apk
          body: |
            Attack Mode Android app, built from ${{ github.sha }}.
            Download attack-mode.apk below and install it on your phone.
