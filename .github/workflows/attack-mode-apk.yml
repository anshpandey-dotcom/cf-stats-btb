name: Attack Mode APK

on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths:
      - "attack-mode/**"
      - ".github/workflows/attack-mode-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: attack-mode
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('attack-mode/android/**/*.gradle', 'attack-mode/android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: bun install --frozen-lockfile

      - run: bun run build:web

      - run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk attack-mode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: attack-mode-apk
          path: attack-mode/attack-mode.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk attack-mode/attack-mode.apk \
            --title "Attack Mode (Android APK)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA}. Download on your phone and install." \
            --target "${GITHUB_SHA}"
