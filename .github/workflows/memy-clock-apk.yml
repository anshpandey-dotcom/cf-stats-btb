name: Build Memy Clock APK

on:
  push:
    paths:
      - 'memy-clock/**'
      - '.github/workflows/memy-clock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memy-clock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MemyClock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MemyClock-apk
          path: memy-clock/MemyClock.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: memy-clock-latest
          name: Memy Clock (latest build)
          prerelease: false
          make_latest: false
          files: memy-clock/MemyClock.apk
          body: |
            Memy Clock Android app, built from ${{ github.sha }}.
            Download MemyClock.apk below and install it on your phone.
