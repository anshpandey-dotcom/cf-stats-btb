name: Build StopIt APK

on:
  push:
    paths:
      - 'StopIt/**'
      - '.github/workflows/stopit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StopIt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk StopIt.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopIt
          path: StopIt/StopIt.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: StopIt v1.0
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: StopIt/StopIt.apk
          body: |
            StopIt v1.0 for Android. Download StopIt.apk below and install it.

            Setup takes two permissions: Usage access and Display over other apps.
            StopIt has no internet permission, so nothing ever leaves your phone.

            Made by Ansh Pandey ❤️ https://www.instagram.com/iam.anshpandey
