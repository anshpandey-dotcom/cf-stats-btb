name: Build StopIt APK

on:
  push:
    paths:
      - 'StopIt/**'
      - '.github/workflows/stopit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StopIt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk StopIt.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopIt
          path: StopIt/StopIt.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stopit-v1.0.${{ github.run_number }}
          name: StopIt v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: StopIt/StopIt.apk
          body: |
            StopIt for Android. Download StopIt.apk below and install it.
            After installing, open StopIt, turn on StopIt Guard in Accessibility, and pick the apps you want to guard.
