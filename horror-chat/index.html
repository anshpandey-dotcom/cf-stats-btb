<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Unknown</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <section id="setup" class="screen">
    <img class="setup-dp" src="assets/dp.jpg" alt="">
    <h1>Unknown</h1>
    <p>Pick what this phone does tonight</p>
    <button id="roleHost" class="big">Host phone<small>I stream and control the scares</small></button>
    <button id="roleGuest" class="big alt">Guest phone<small>I join the live link</small></button>
  </section>

  <section id="chat" class="screen" hidden>
    <header id="topbar">
      <button class="icon" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
      <img id="peerDp" class="dp" src="assets/dp.jpg" alt="">
      <div class="who">
        <div id="peerName" class="name">Unknown</div>
        <div id="peerStatus" class="status">connecting…</div>
      </div>
      <button class="icon" id="linkBtn" aria-label="Connect"><svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.4-3.4a3 3 0 1 1 4.2 4.2l-1.5 1.5-1.4-1.4 1.5-1.5a1 1 0 1 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0zm2.8-2.8a1 1 0 0 1 0 1.4L10 15.4a3 3 0 1 1-4.2-4.2l1.5-1.5 1.4 1.4-1.5 1.5a1 1 0 1 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0z"/></svg></button>
      <button class="icon" id="videoBtn" aria-label="Video"><svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10m1-2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4V7a1 1 0 0 0-1-1z"/></svg></button>
      <button class="icon" id="callBtn" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg></button>
      <button class="icon" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
    </header>

    <div id="menu" class="menu" hidden></div>

    <main id="thread"></main>

    <footer id="composer">
      <div id="recBar" class="rec-bar" hidden>
        <button class="icon" id="recCancel" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg></button>
        <span class="rec-dot"></span><span id="recTime">0:00</span>
        <span class="rec-hint">Recording…</span>
      </div>
      <div id="inputRow" class="input-row">
        <div class="field">
          <button class="icon" id="stickerBtn" aria-label="Emoji"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM8.5 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 17.5c2.3 0 4.3-1.5 5-3.5H7c.7 2 2.7 3.5 5 3.5z"/></svg></button>
          <textarea id="msgInput" rows="1" placeholder="Message" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
          <button class="icon" id="attachBtn" aria-label="Attach"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6z"/></svg></button>
          <button class="icon" id="cameraBtn" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M12 8.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM9 2 7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.2L15 2z"/></svg></button>
        </div>
        <button id="sendBtn" class="round" aria-label="Send">
          <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
          <svg id="sendIcon" viewBox="0 0 24 24" hidden><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <input id="filePick" type="file" accept="image/*" multiple hidden>
      <input id="camPick" type="file" accept="image/*" capture="environment" hidden>
    </footer>
  </section>
</div>

<div id="connectSheet" class="sheet" hidden>
  <div class="sheet-body">
    <div class="sheet-head"><h2 id="connectTitle">Connect</h2><button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button></div>
    <div id="hostPane" hidden>
      <p class="hint">Send this live link to the guest phone. It stays the same every time, so the guest only pastes it once.</p>
      <input id="hostLink" readonly>
      <div class="row"><button id="copyLink" class="primary">Copy link</button><button id="shareLink">Share</button></div>
      <p id="hostState" class="state"></p>
    </div>
    <div id="guestPane" hidden>
      <p class="hint">Paste the live link from the host phone.</p>
      <input id="guestLink" placeholder="Paste live link here" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button id="pasteLink">Paste</button><button id="joinLink" class="primary">Connect</button></div>
      <p id="guestState" class="state"></p>
    </div>
  </div>
</div>

<div id="controlSheet" class="sheet" hidden>
  <div class="sheet-body tall">
    <div class="sheet-head"><h2>Control room</h2><button class="icon" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button></div>
    <nav class="tabs">
      <button data-tab="scares" class="on">Scares</button>
      <button data-tab="story">Story</button>
      <button data-tab="tools">Tools</button>
    </nav>
    <div id="tab-scares" class="tabpane"></div>
    <div id="tab-story" class="tabpane" hidden></div>
    <div id="tab-tools" class="tabpane" hidden></div>
  </div>
</div>

<div id="lightbox" hidden><img alt=""></div>
<div id="scare" hidden><canvas id="scareStatic"></canvas><img id="scareImg" alt=""><div id="scareEyes"><i></i><i></i></div></div>
<div id="fog"></div>
<div id="toast" hidden></div>

<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
