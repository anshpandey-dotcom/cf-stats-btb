plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.anshpandey.stopit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anshpandey.stopit'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('stopit.jks')
            storePassword 'stopit2026'
            keyAlias 'stopit'
            keyPassword 'stopit2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
