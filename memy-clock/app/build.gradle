plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def sherpaVersion = "1.13.8"
def sherpaAar = file("libs/sherpa-onnx-${sherpaVersion}.aar")

tasks.register("fetchSherpa") {
    outputs.file(sherpaAar)
    onlyIf { !sherpaAar.exists() }
    doLast {
        sherpaAar.parentFile.mkdirs()
        def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar"
        new URL(url).withInputStream { input -> sherpaAar.withOutputStream { it << input } }
    }
}

android {
    namespace "com.ansh.memyclock"
    compileSdk 35

    defaultConfig {
        applicationId "com.ansh.memyclock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    signingConfigs {
        release {
            storeFile file("memy-clock.jks")
            storePassword "memyclock"
            keyAlias "memyclock"
            keyPassword "memyclock"
        }
    }

    buildTypes {
        debug {
            ndk { abiFilters "x86_64" }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures { compose true }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.maxHeapSize = "2g"
                it.systemProperty "roborazzi.test.record", "true"
            }
        }
    }

    packaging {
        resources { excludes += ["META-INF/*.kotlin_module", "META-INF/LICENSE*", "META-INF/NOTICE*"] }
        jniLibs {
            useLegacyPackaging true
            excludes += ["**/libsherpa-onnx-c-api.so", "**/libsherpa-onnx-cxx-api.so"]
        }
    }
}

preBuild.dependsOn("fetchSherpa")

dependencies {
    implementation files(sherpaAar)
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.apache.commons:commons-compress:1.27.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.32.2"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.32.2"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
