plugins {
    id "com.android.application"
}

def keystoreFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

def modelAssets = layout.buildDirectory.dir("generated/modelassets").get().asFile

tasks.register("copyModels", Copy) {
    from(rootProject.file("../voice-enhancer/models")) {
        include "*.onnx"
    }
    into(new File(modelAssets, "models"))
}

android {
    namespace "com.anshpandey.cleanaf"
    compileSdk 36

    defaultConfig {
        applicationId "com.anshpandey.cleanaf"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "2.1.1"
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            assets.srcDir(modelAssets)
        }
    }

    androidResources {
        noCompress += ["onnx"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "com.google.android.material:material:1.13.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.23.2"
    implementation "de.sciss:jump3r:1.0.5"
}

tasks.named("preBuild") {
    dependsOn("copyModels")
}
