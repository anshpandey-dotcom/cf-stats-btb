plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def appVersionCode = Integer.parseInt(System.getenv("VERSION_CODE") ?: "2")

android {
    namespace = "com.attackmode.planner"
    compileSdk = 36

    defaultConfig {
        applicationId "com.attackmode.planner"
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName "2.${appVersionCode}"
    }

    signingConfigs {
        release {
            storeFile file('attackmode-release.jks')
            storePassword 'attackmode'
            keyAlias 'attackmode'
            keyPassword 'attackmode'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/versions/**']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
